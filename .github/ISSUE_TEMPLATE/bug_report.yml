name: Bug report
description: Report a reproducible checkpoint, rewind, fork, or UI failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private Session content, or quarantine files. Use a private security advisory for path escape, unintended deletion, or data exposure.
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: DSH, Node.js, Git, operating system, and Git/fallback backend versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, checkpoint topology, and whether hand edits or staged changes existed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I preserved the workspace and `.dsh/time-machine` before cleanup.
          required: true
        - label: I removed tokens, secrets, private paths, and Session content.
          required: true
