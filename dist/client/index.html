<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness - 时光机仪表盘</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- 顶栏 Header -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">⏳</div>
        <div>
          <!-- English compatibility labels: DSH Time Machine / Coordinated Session Fork -->
          <h1>DSH 时光机</h1>
          <span class="subtitle" data-i18n="subtitle">会话分叉、工作区恢复与 DAG 分支探索</span>
        </div>
      </div>
      <div class="nav-metrics">
        <div class="metric-chip">
          <span class="label" data-i18n="branchLabel">分支：</span>
          <span id="current-branch-badge" class="value badge-branch">main</span>
        </div>
        <div class="metric-chip">
          <span class="label" data-i18n="sessionLabel">会话：</span>
          <select id="session-selector" class="session-selector" aria-label="选择 DSH 会话" disabled>
            <option value="" data-i18n="noSessions">暂无已保存会话</option>
          </select>
          <span id="session-badge" class="value">none</span>
        </div>
        <button id="btn-undo-latest" class="btn btn-primary" disabled>↶ <span data-i18n="undoLatest">撤销最新轮次</span></button>
        <button id="btn-refresh" class="btn btn-secondary">🔄 <span data-i18n="refresh">刷新</span></button>
        <button id="btn-language" class="btn btn-secondary" type="button" aria-label="切换界面语言">EN</button>
      </div>
    </header>

    <!-- 主体区域 -->
    <main class="main-layout">
      <!-- 左侧：时间轴与 DAG 分支流 -->
      <section class="timeline-pane">
        <div class="pane-header">
          <h2 data-i18n="timelineTitle">探索时间线（DAG）</h2>
          <span id="node-count" class="badge">0 个检查点</span>
        </div>
        <div id="timeline-flow" class="timeline-container">
          <div class="loading" data-i18n="loading">正在加载检查点……</div>
        </div>
      </section>

      <!-- 右侧：节点详情与操作面板 -->
      <section class="inspector-pane">
        <div class="pane-header">
          <h2 data-i18n="inspectorTitle">检查点详情</h2>
          <div id="inspector-status-badge" class="badge badge-idle" data-i18n="selectTurn">请选择一个轮次</div>
        </div>

        <div id="inspector-content" class="inspector-body empty-state">
          <p data-i18n="emptyInspector">点击时间线中的检查点，可查看详情、检查差异或发起时光回滚。</p>
        </div>
      </section>
    </main>

    <!-- 弹窗：Fork 新分支 -->
    <div id="fork-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 data-i18n="forkTitle">🌿 创建探索分支</h3>
        <p><span data-i18n="forkIntro">从</span> <strong id="modal-fork-from">turn</strong> <span data-i18n="forkIntroEnd">创建平行探索分支，不覆盖当前进度。</span></p>
        <div class="form-group">
          <label data-i18n="branchName">新分支名称：</label>
          <input type="text" id="fork-branch-input" placeholder="例如 experiment/jwt-auth" />
        </div>
        <div class="form-group">
          <label data-i18n="descriptionOptional">描述（可选）：</label>
          <input type="text" id="fork-desc-input" placeholder="例如：尝试使用 JWT 的替代认证方案" />
        </div>
        <div class="modal-actions">
          <button id="modal-cancel-fork" class="btn btn-secondary" data-i18n="cancel">取消</button>
          <button id="modal-confirm-fork" class="btn btn-primary" data-i18n="forkConfirm">创建并切换分支</button>
        </div>
      </div>
    </div>

    <!-- 弹窗：Diff 差异查看器 -->
    <div id="diff-modal" class="modal-overlay hidden">
      <div class="modal-card diff-modal-card">
        <div class="modal-header">
          <h3 id="diff-title" data-i18n="diffViewer">文件差异查看器</h3>
          <button id="diff-modal-close" class="btn-icon">✕</button>
        </div>
        <pre id="diff-content" class="diff-view"></pre>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
